# HireWise backend — Render Blueprint
# Deploy: Render Dashboard → New → Blueprint → select this repo → Apply
# (Render prompts for the SMTP_* secret values marked sync: false)

services:
  - type: web
    name: hirewise-backend
    runtime: python
    rootDir: backend
    plan: free

    # Install deps, generate dataset + train the ML model (the .pkl
    # artifacts are gitignored, so they must be rebuilt here), and
    # warm the NLTK data cache (downloaded on import during training).
    buildCommand: pip install -r requirements.txt && python train_model.py

    # Render injects $PORT — bind to it. Single worker + threads keeps
    # memory within the free tier's 512 MB (sklearn import is heavy).
    # Serves via wsgi:app (backend/wsgi.py) — plain word, no parentheses:
    # Render runs this through `bash -c`, where an unquoted app:create_app()
    # is parsed as a shell function definition and fails with a syntax error.
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 wsgi:app

    healthCheckPath: /api/health

    envVars:
      - key: PYTHON_VERSION
        value: 3.13.6
      # Random UUID generated by Render on first deploy
      - key: SECRET_KEY
        generateValue: true
      # SQLite file lives on the instance disk (ephemeral on free plan —
      # candidate data resets on each deploy/restart)
      - key: DATABASE_URL
        value: sqlite:///hirewise.db
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      # Secrets — entered in the dashboard when applying the blueprint
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_SENDER
        sync: false
